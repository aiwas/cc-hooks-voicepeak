[build-system]
# PEP 639 の license 式と license-files を解釈できるのが 77 以降
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-hooks-voicepeak"
# バージョンは cc_voicepeak/__init__.py の __version__ から取る ([tool.setuptools.dynamic])
dynamic = ["version"]
description = "Claude Code Hooks の結果を VOICEPEAK に読み上げさせる (WSL -> Windows 連携込み)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miyako Kuwano" }]
keywords = ["claude-code", "hooks", "voicepeak", "tts", "wsl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: Japanese",
  # WSL 上 (Linux) で動き、Windows 側の voicepeak.exe を呼び出す
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aiwas/cc-hooks-voicepeak"
Repository = "https://github.com/aiwas/cc-hooks-voicepeak"
Issues = "https://github.com/aiwas/cc-hooks-voicepeak/issues"

[project.scripts]
cc-voicepeak = "cc_voicepeak.cli:main"

[tool.setuptools]
packages = ["cc_voicepeak"]

[tool.setuptools.dynamic]
version = { attr = "cc_voicepeak.__version__" }

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# UP: 3.13 で使える記法へ (PEP 585/604 の型注釈など) / F: 未使用 import など / I: import の並び
select = ["F", "I", "UP"]

[tool.setuptools.package-data]
cc_voicepeak = ["py.typed"]
