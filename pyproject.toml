[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-hooks-voicepeak"
version = "0.1.0"
description = "Claude Code Hooks の結果を VOICEPEAK に読み上げさせる (WSL -> Windows 連携込み)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Miyako Kuwano" }]
keywords = ["claude-code", "hooks", "voicepeak", "tts", "wsl"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Japanese",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.scripts]
cc-voicepeak = "cc_voicepeak.cli:main"

[tool.setuptools]
packages = ["cc_voicepeak"]

[tool.setuptools.package-data]
cc_voicepeak = ["py.typed"]
